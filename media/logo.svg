<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A button, and the confirmation it asks for.

       Its sibling pcf-form-action-button is a pill with a chevron leaving it,
       because what that control does is hand the press to somebody else's code.
       This one is the canvas button, and the thing it has that a plain Button
       does not is the optional second step, so the pill carries the answer to
       it. Same silhouette as the sibling on purpose; different interior.

       The ramp is the PCFHub mark's own, verbatim, so this sits in the family rather
       than beside it. Declared in userSpaceOnUse and spanning the whole 96
       canvas, so the mark reads as one object lit from the top right.

       Drawn for 32px. The check is stroke 10 rather than a filled glyph so it
       holds the same weight as the sibling's chevron at that size.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="action-button-ramp" x1="6" y1="82" x2="90" y2="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>
  <!-- The button. -->
  <rect x="6" y="26" width="84" height="44" rx="22" fill="url(#action-button-ramp)"/>

  <!-- The confirm. Round joins: a mitred check throws a spike off the elbow at
       this weight. -->
  <path d="M32 48 L43 59 L64 37" stroke="#F8FAFC" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
